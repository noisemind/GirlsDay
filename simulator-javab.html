<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شبیه‌ساز جواب دادن دیر به پیام</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: linear-gradient(160deg, #e8eaf6, #f3e5f5, #fce4ec);
      min-height: 100vh;
      color: #4a148c;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin-top: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #6a1b9a;
    }
    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #8e24aa;
      margin-bottom: 25px;
    }
    .phone {
      background: #1a1a2e;
      border-radius: 30px;
      padding: 15px 12px 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .phone-header {
      background: #16213e;
      border-radius: 20px 20px 0 0;
      padding: 12px;
      text-align: center;
      color: white;
      font-size: 0.9rem;
    }
    .chat {
      background: #0f3460;
      min-height: 320px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      animation: fadeIn 0.4s ease;
    }
    .bubble.me {
      background: #ec407a;
      color: white;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }
    .bubble.her {
      background: #e0e0e0;
      color: #333;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
    }
    .typing {
      align-self: flex-end;
      background: #e0e0e0;
      color: #666;
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.85rem;
      display: none;
    }
    .input-area {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #f8bbd0;
      border-radius: 25px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #ec407a; }
    .send-btn {
      background: linear-gradient(90deg, #ec407a, #ab47bc);
      color: white;
      border: none;
      padding: 0 22px;
      border-radius: 25px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .controls {
      margin-top: 20px;
      text-align: center;
    }
    .delay-info {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin-top: 15px;
      text-align: center;
      font-size: 0.95rem;
      box-shadow: 0 8px 25px rgba(171,71,188,0.1);
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 شبیه‌ساز جواب دیر دادن</h1>
    <p class="subtitle">ببین اگه پیام بدی، طرف مقابل کی و چطور جواب می‌ده</p>

    <div class="phone">
      <div class="phone-header">گفتگو با «دختر نمونه»</div>
      <div class="chat" id="chat">
        <div class="bubble her">سلام 😊</div>
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="msg" placeholder="پیامت رو بنویس..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">ارسال</button>
    </div>

    <div class="delay-info" id="info"></div>
  </div>

  <script>
    const replies = [
      { delay: 12, text: "باشه" },
      { delay: 45, text: "اوکی 👍" },
      { delay: 90, text: "آها" },
      { delay: 180, text: "ببخشید الان دیدم" },
      { delay: 300, text: "سلام، خوبی؟" },
      { delay: 600, text: "وای الان دیدم پیام‌تو 😅" },
      { delay: 1200, text: "آخه مشغول بودم" },
      { delay: 3600, text: "ببخشید دیر جواب دادم، گوشیم ساکت بود" },
      { delay: 7200, text: "الان دیدم... چی شده بود؟" },
      { delay: 14400, text: "سلام 😊 (بعد از نیم روز)" }
    ];

    const funnyReasons = [
      "در حال انتخاب فیلتر مناسب برای استوری بود",
      "داشت به پیام قبلی‌ات فکر می‌کرد که چی جواب بده",
      "آینه رو چک می‌کرد",
      "داشت تصمیم می‌گرفت امروز چه احساسی داشته باشه",
      "مشغول شمردن کفش‌هاش بود",
      "داشت به این فکر می‌کرد که چرا تو زود جواب می‌دی",
      "در حال نوشتن یه کپشن طولانی بود",
      "داشت با خودش حرف می‌زد که «نذار زود جواب بدم»"
    ];

    function sendMessage() {
      const input = document.getElementById('msg');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chat');
      
      // My message
      const myBubble = document.createElement('div');
      myBubble.className = 'bubble me';
      myBubble.textContent = text;
      chat.appendChild(myBubble);
      input.value = '';

      // Typing indicator
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.id = 'typing';
      typing.textContent = 'در حال نوشتن...';
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      // Random reply
      const reply = replies[Math.floor(Math.random() * replies.length)];
      const reason = funnyReasons[Math.floor(Math.random() * funnyReasons.length)];

      // Show delay info
      const info = document.getElementById('info');
      info.style.display = 'block';
      info.innerHTML = `⏳ تأخیر انتخاب‌شده: <strong>${formatTime(reply.delay)}</strong><br>دلیل احتمالی: ${reason}`;

      // Actual reply after short animation delay (for demo we speed it up)
      setTimeout(() => {
        typing.remove();
        const herBubble = document.createElement('div');
        herBubble.className = 'bubble her';
        herBubble.textContent = reply.text;
        chat.appendChild(herBubble);
        chat.scrollTop = chat.scrollHeight;
      }, 1500 + Math.random() * 1500);
    }

    function formatTime(sec) {
      if (sec < 60) return sec + ' ثانیه';
      if (sec < 3600) return Math.round(sec / 60) + ' دقیقه';
      return Math.round(sec / 3600) + ' ساعت';
    }
  </script>
</body>
</html>
