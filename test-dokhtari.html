<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست بده ببین چقدر دختری | آزمون رسمی درصد دختر بودن</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: linear-gradient(160deg, #fce4ec 0%, #f3e5f5 40%, #e8eaf6 100%);
      min-height: 100vh;
      color: #4a148c;
      line-height: 1.7;
    }
    
    .header {
      background: linear-gradient(90deg, #ec407a, #7b1fa2);
      color: white;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(236, 64, 122, 0.35);
    }
    
    .header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    
    .header p {
      font-size: 1rem;
      opacity: 0.95;
    }
    
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 12px 40px rgba(123, 31, 162, 0.12);
      margin-bottom: 25px;
    }
    
    .progress-bar {
      height: 10px;
      background: #f8bbd0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ec407a, #ab47bc);
      border-radius: 10px;
      transition: width 0.4s ease;
      width: 0%;
    }
    
    .question-number {
      font-size: 0.9rem;
      color: #ab47bc;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #6a1b9a;
      margin-bottom: 25px;
    }
    
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .option {
      background: #fce4ec;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
      text-align: right;
    }
    
    .option:hover {
      background: #f8bbd0;
      border-color: #f48fb1;
    }
    
    .option.selected {
      background: linear-gradient(90deg, #f48fb1, #ce93d8);
      border-color: #ec407a;
      color: #4a148c;
      font-weight: 600;
    }
    
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #ec407a, #ab47bc);
      color: white;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 25px;
      transition: opacity 0.2s, transform 0.1s;
    }
    
    .btn:hover {
      opacity: 0.92;
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .result-box {
      text-align: center;
      display: none;
    }
    
    .result-emoji {
      font-size: 5rem;
      margin-bottom: 15px;
    }
    
    .result-percent {
      font-size: 3.5rem;
      font-weight: 700;
      color: #c2185b;
      margin-bottom: 10px;
    }
    
    .result-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #6a1b9a;
      margin-bottom: 15px;
    }
    
    .result-desc {
      font-size: 1.05rem;
      color: #5d4037;
      margin-bottom: 25px;
      line-height: 1.8;
    }
    
    .restart-btn {
      background: linear-gradient(90deg, #7b1fa2, #512da8);
    }
    
    .hidden {
      display: none;
    }
    
    .footer {
      text-align: center;
      padding: 20px;
      color: #8e24aa;
      font-size: 0.85rem;
      opacity: 0.8;
    }
    
    @media (max-width: 500px) {
      .header h1 { font-size: 1.5rem; }
      .question-text { font-size: 1.1rem; }
      .result-percent { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎀 تست بده ببین چقدر دختری</h1>
    <p>آزمون علمی و کاملاً معتبر اندازه‌گیری درصد دختر بودن</p>
  </div>

  <div class="container">
    <!-- Quiz Section -->
    <div id="quiz-section" class="card">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      
      <div class="question-number" id="q-number">سوال ۱ از ۸</div>
      <div class="question-text" id="q-text">وقتی یکی بهت پیام می‌ده، معمولاً چقدر طول می‌کشه جواب بدی؟</div>
      
      <div class="options" id="options">
        <!-- Options will be injected by JS -->
      </div>
      
      <button class="btn" id="next-btn" disabled onclick="nextQuestion()">سوال بعدی</button>
    </div>

    <!-- Result Section -->
    <div id="result-section" class="card result-box">
      <div class="result-emoji" id="result-emoji">👑</div>
      <div class="result-percent" id="result-percent">۰٪</div>
      <div class="result-title" id="result-title">عنوان</div>
      <div class="result-desc" id="result-desc">توضیحات</div>
      <button class="btn restart-btn" onclick="restartQuiz()">دوباره تست بده</button>
    </div>
  </div>

  <div class="footer">
    این تست کاملاً علمی است و توسط هیچ دانشمندی تأیید نشده 😄<br>
    فقط برای خنده درست شده • روز دختر مبارک
  </div>

  <script>
    const questions = [
      {
        q: "وقتی یکی بهت پیام می‌ده، معمولاً چقدر طول می‌کشه جواب بدی؟",
        options: [
          { text: "بلافاصله جواب می‌دم", score: 10 },
          { text: "۱۰ تا ۳۰ دقیقه صبر می‌کنم که باکلاس به نظر برسم", score: 40 },
          { text: "چند ساعت بعد، وقتی حوصله‌م شد", score: 70 },
          { text: "گاهی عمداً یک روز کامل جواب نمی‌دم", score: 100 }
        ]
      },
      {
        q: "رابطه‌ت با آینه چطوره؟",
        options: [
          { text: "روزانه چند بار چک می‌کنم که همه چیز مرتب باشه", score: 80 },
          { text: "فقط وقتی دارم می‌رم بیرون نگاه می‌کنم", score: 40 },
          { text: "آینه؟ چه آینه‌ای؟", score: 10 },
          { text: "با آینه حرف هم می‌زنم گاهی", score: 100 }
        ]
      },
      {
        q: "وقتی کسی بهت می‌گه «چقدر قشنگ شدی»، واکنش اصلیت چیه؟",
        options: [
          { text: "مرسی 😊", score: 30 },
          { text: "نه بابا، این‌طوریا هم نیست...", score: 90 },
          { text: "می‌دونم 😎", score: 60 },
          { text: "دلم می‌خواد جزئیات بیشتری بشنوم", score: 100 }
        ]
      },
      {
        q: "کیف پول یا کیف دستی‌ت معمولاً چقدر سنگینه؟",
        options: [
          { text: "فقط کارت و کلید", score: 15 },
          { text: "یه کم لوازم ضروری داره", score: 50 },
          { text: "مثل یه کوله اضطراری کامل پره", score: 85 },
          { text: "اگه گمش کنم، زندگیم تموم می‌شه", score: 100 }
        ]
      },
      {
        q: "نسبت به رنگ صورتی چطور فکر می‌کنی؟",
        options: [
          { text: "عاشقشم، رنگ مورد علاقه‌مه", score: 100 },
          { text: "دوست دارم ولی زیاده‌روی نمی‌کنم", score: 60 },
          { text: "خنثی‌ام، گاهی استفاده می‌کنم", score: 30 },
          { text: "از صورتی متنفرم", score: 5 }
        ]
      },
      {
        q: "وقتی عصبانی می‌شی، معمولاً چیکار می‌کنی؟",
        options: [
          { text: "مستقیم می‌گم چی ناراحتم کرده", score: 20 },
          { text: "ساکت می‌شم و انتظار دارم طرف بفهمه", score: 85 },
          { text: "یه پست مبهم توی استوری می‌ذارم", score: 95 },
          { text: "می‌رم گریه می‌کنم و بعد بهتر می‌شم", score: 70 }
        ]
      },
      {
        q: "چقدر طول می‌کشه از خونه بیرون بری؟ (از لحظه تصمیم تا حرکت)",
        options: [
          { text: "کمتر از ۱۰ دقیقه", score: 10 },
          { text: "۲۰ تا ۳۰ دقیقه", score: 40 },
          { text: "۴۵ دقیقه تا ۱ ساعت", score: 75 },
          { text: "گاهی ۲ ساعت هم می‌شه و هنوز آماده‌ام نیست", score: 100 }
        ]
      },
      {
        q: "اگه بین «حق با منه» و «صلح بهتره» مجبور به انتخاب بشی؟",
        options: [
          { text: "حق با منه، حتی اگه جنگ بشه", score: 30 },
          { text: "بستگی داره موضوع چقدر مهم باشه", score: 50 },
          { text: "معمولاً کوتاه می‌آم که دعوا تموم بشه", score: 70 },
          { text: "اول کوتاه می‌آم، بعد تا ۳ ماه دیگه یادآوری می‌کنم", score: 100 }
        ]
      }
    ];

    let current = 0;
    let totalScore = 0;
    let selectedScore = null;

    function loadQuestion() {
      const q = questions[current];
      document.getElementById('q-number').textContent = `سوال ${current + 1} از ${questions.length}`;
      document.getElementById('q-text').textContent = q.q;
      
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt.text;
        div.onclick = () => selectOption(div, opt.score);
        optionsDiv.appendChild(div);
      });
      
      document.getElementById('next-btn').disabled = true;
      selectedScore = null;
      
      // Update progress
      const progress = ((current) / questions.length) * 100;
      document.getElementById('progress').style.width = progress + '%';
    }

    function selectOption(el, score) {
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedScore = score;
      document.getElementById('next-btn').disabled = false;
    }

    function nextQuestion() {
      if (selectedScore === null) return;
      
      totalScore += selectedScore;
      current++;
      
      if (current < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const maxScore = questions.length * 100;
      const percent = Math.round((totalScore / maxScore) * 100);
      
      document.getElementById('quiz-section').style.display = 'none';
      document.getElementById('result-section').style.display = 'block';
      document.getElementById('progress').style.width = '100%';
      
      let emoji, title, desc;
      
      if (percent >= 85) {
        emoji = '👑';
        title = 'دختر کامل‌عیار';
        desc = 'تبریک! تو اوج دختر بودن هستی. از جواب دیر دادن گرفته تا کیف سنگین و پست‌های مبهم، همه‌چی تمومه. روز دختر مخصوص تو ساخته شده!';
      } else if (percent >= 65) {
        emoji = '💖';
        title = 'دختر تمام‌عیار';
        desc = 'درصد دختر بودنت بالاست! بیشتر ویژگی‌های کلاسیک رو داری. فقط یه کم دیگه تمرین کن تا به سطح افسانه‌ای برسی.';
      } else if (percent >= 40) {
        emoji = '🌸';
        title = 'دختر متعادل';
        desc = 'نه خیلی دخترانه، نه خیلی غیردخترانه. یه تعادل قشنگ داری. گاهی صورتی دوست داری، گاهی هم نه. کاملاً نرمال و دوست‌داشتنی.';
      } else if (percent >= 20) {
        emoji = '🌿';
        title = 'دختر مینیمال';
        desc = 'درصد دختر بودنت پایینه، ولی این اصلاً بد نیست! تو از اون دسته‌ای هستی که کمتر کلیشه‌ای عمل می‌کنی. احترام می‌ذاریم.';
      } else {
        emoji = '⚡';
        title = 'دختر آنتی‌کلیشه';
        desc = 'تقریباً هیچکدوم از کلیشه‌های دخترانه رو نداری! یا خیلی خاص هستی، یا این تست اصلاً به درد تو نمی‌خوره. در هر صورت، روز دختر باز هم به تو تعلق داره ❤️';
      }
      
      document.getElementById('result-emoji').textContent = emoji;
      document.getElementById('result-percent').textContent = percent + '٪';
      document.getElementById('result-title').textContent = title;
      document.getElementById('result-desc').textContent = desc;
    }

    function restartQuiz() {
      current = 0;
      totalScore = 0;
      document.getElementById('quiz-section').style.display = 'block';
      document.getElementById('result-section').style.display = 'none';
      loadQuestion();
    }

    // Start
    loadQuestion();
  </script>
</body>
</html>
